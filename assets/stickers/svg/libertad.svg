<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
    <linearGradient id="gSub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12a55b"/>
      <stop offset="100%" stop-color="#0a7a3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="shadowHard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <text x="256" y="266" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="92" font-weight="900" fill="url(#gText)" stroke="#141414" stroke-width="8" letter-spacing="1" filter="url(#shadow)" paint-order="stroke">LIBERTAD</text>
  <text x="256" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="url(#gSub)" stroke="#141414" stroke-width="4" filter="url(#shadowHard)" paint-order="stroke">PALESTINA LIBRE</text>
  <g filter="url(#shadowHard)">
    <rect x="148" y="384" width="216" height="18" rx="9" fill="#141414"/>
    <rect x="120" y="424" width="120" height="18" rx="9" fill="#ce1126"/>
    <rect x="252" y="424" width="140" height="18" rx="9" fill="#0a7a3d"/>
  </g>
</svg>
