<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0d0d10; padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px; background-color:#ffffff; border-radius:12px; border:1px solid #e5e5e5;">

        <tr>
          <td>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td width="150" height="6" bgcolor="#000000"></td>
                <td width="150" height="6" bgcolor="#ffffff"></td>
                <td width="150" height="6" bgcolor="#1d7c41"></td>
                <td width="150" height="6" bgcolor="#d80032"></td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="background-color:#1a1a20; padding:28px 32px; text-align:center;">
            <div style="color:#ffffff; font-size:26px; font-weight:bold; letter-spacing:3px; font-family:Arial,Helvetica,sans-serif;">FREEPALESTINE</div>
            <div style="color:#9a9aa3; font-size:13px; margin-top:6px; font-family:Arial,Helvetica,sans-serif;">Nuevo mensaje desde la web</div>
          </td>
        </tr>

        <tr>
          <td style="padding:32px;">
            <h1 style="margin:0 0 20px; font-size:22px; color:#111111; font-family:Arial,Helvetica,sans-serif;">Nuevo mensaje de un visitante</h1>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding:8px 0; color:#777777; font-size:13px; font-family:Arial,Helvetica,sans-serif; width:90px; vertical-align:top;">Correo</td>
                <td style="padding:8px 0; color:#111111; font-size:15px; font-weight:bold; font-family:Arial,Helvetica,sans-serif;">{{email}}</td>
              </tr>
              <tr>
                <td style="padding:8px 0; color:#777777; font-size:13px; font-family:Arial,Helvetica,sans-serif; width:90px; vertical-align:top;">Asunto</td>
                <td style="padding:8px 0; color:#111111; font-size:15px; font-weight:bold; font-family:Arial,Helvetica,sans-serif;">{{subject}}</td>
              </tr>
              <tr>
                <td style="padding:8px 0; color:#777777; font-size:13px; font-family:Arial,Helvetica,sans-serif; width:90px; vertical-align:top;">Mensaje</td>
                <td style="padding:8px 0; color:#333333; font-size:15px; line-height:1.6; font-family:Arial,Helvetica,sans-serif; white-space:pre-line;">{{msg}}</td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="background-color:#f5f5f5; padding:16px 32px; text-align:center; font-size:12px; color:#777777; font-family:Arial,Helvetica,sans-serif; line-height:1.5;">
            Responder directamente al remitente desde el correo (botón responder).
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
